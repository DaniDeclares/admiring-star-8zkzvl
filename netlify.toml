[build]
  command = "npm run build"
  publish = "build"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/verify-commercial-intent"
  to = "/.netlify/functions/verify-commercial-intent"
  status = 200

[[redirects]]
  from = "/api/intake-webhook"
  to = "/.netlify/functions/intake-webhook"
  status = 200

[[redirects]]
  from = "/api/portal-operations"
  to = "/.netlify/functions/portal-operations"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Secret scanning remains enabled; server-only runtime keys and SUPABASE_URL are omitted by site config.\n# Production deploy sync marker: owner portal API adapter + governed owner auth.
