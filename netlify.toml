# DANI continuity candidate configuration.
# This file intentionally configures BUILD/STATIC ROUTING ONLY.
# API/function routing is blocked until compatibility adapters pass tester parity.

[build]
  command = "npm run audit:netlify-continuity && npm run build"
  publish = "build"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Preserve generated SEO shells used by current Vercel production.
[[redirects]]
  from = "/"
  to = "/seo/home.html"
  status = 200
[[redirects]]
  from = "/services"
  to = "/seo/services.html"
  status = 200
[[redirects]]
  from = "/resident-concierge"
  to = "/seo/resident-concierge.html"
  status = 200
[[redirects]]
  from = "/about"
  to = "/seo/about.html"
  status = 200
[[redirects]]
  from = "/contact"
  to = "/seo/contact.html"
  status = 200
[[redirects]]
  from = "/blog"
  to = "/seo/blog.html"
  status = 200

# Only API routes with audited Netlify compatibility adapters are enabled.
# All other /api/* routes remain unavailable until individually classified and proven.
[[redirects]]
  from = "/api/portal-operations"
  to = "/.netlify/functions/portal-operations"
  status = 200
  force = true

# Portal/application routes fall back to React.
[[redirects]]
  from = "/portal/*"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/provider/*"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/internal/*"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/staff/*"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/government/*"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/pay/*"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/service/*"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/blog/*"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
