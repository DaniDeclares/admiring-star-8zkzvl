[build]
  command = "npm run build"
  publish = "build"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/verify-commercial-intent"
  to = "/.netlify/functions/verify-commercial-intent"
  status = 200

[[redirects]]
  from = "/api/intake-webhook"
  to = "/.netlify/functions/intake-webhook"
  status = 200

[[redirects]]
  from = "/api/create-checkout-session"
  to = "/.netlify/functions/create-checkout-session"
  status = 200

[[redirects]]
  from = "/api/stripe-webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200

[[redirects]]
  from = "/api/portal-operations"
  to = "/.netlify/functions/portal-operations"
  status = 200

[[redirects]]
  from = "/api/appointment-response"
  to = "/.netlify/functions/appointment-response"
  status = 200

[[redirects]]
  from = "/api/process-outbox"
  to = "/.netlify/functions/process-outbox"
  status = 200

[[redirects]]
  from = "/api/integrations/gmail/sync"
  to = "/.netlify/functions/gmail-sync"
  status = 200

[[redirects]]
  from = "/api/provider-support-recovery"
  to = "/.netlify/functions/provider-support-recovery"
  status = 200

[[redirects]]
  from = "/api/provider-accounting"
  to = "/.netlify/functions/provider-accounting"
  status = 200

[[redirects]]
  from = "/api/portal-fulfillment"
  to = "/.netlify/functions/portal-fulfillment-dispatch"
  status = 200

[[redirects]]
  from = "/api/portal-dispatch"
  to = "/.netlify/functions/provider-routing"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Secret scanning remains enabled; server-only runtime keys and SUPABASE_URL are omitted by site config.
