# Netlify Functions own /api/*.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# SPA/private routes
[[redirects]]
  from = "/portal/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/provider/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/internal/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/pay/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/service/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/blog/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/staff/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/government/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/signup"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/forgot-password"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/reset-password"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/accept-invite"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/providers"
  to = "/index.html"
  status = 200

# Fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[context.production.environment]
  DANI_DEPLOY_PLATFORM = "NETLIFY"
