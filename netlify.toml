[build]
  command = "npm run build"
  publish = "build"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/"
  to = "/seo/home.html"
  status = 200

[[redirects]]
  from = "/services"
  to = "/seo/services.html"
  status = 200

[[redirects]]
  from = "/resident-concierge"
  to = "/seo/resident-concierge.html"
