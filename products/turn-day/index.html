<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Turn Day</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f7f0df;color:#2a241d;min-height:100vh;display:grid;place-items:center}.app{width:min(920px,94vw);background:#fffaf0;border:2px solid #c6a15b;border-radius:24px;padding:24px;box-shadow:0 18px 60px #0002}h1{margin:0;font-size:clamp(34px,7vw,72px)}.tag{letter-spacing:.12em;text-transform:uppercase}.stats,.rooms{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.card,button{border:1px solid #d7c49a;border-radius:14px;padding:14px;background:#fff}.rooms{grid-template-columns:repeat(2,1fr)}button{cursor:pointer;font-weight:700;font-size:16px}button:hover{transform:translateY(-1px)}button:disabled{opacity:.45}.room h3{margin:0 0 6px}.bar{height:10px;background:#eee1c4;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:#b78b39}.log{min-height:54px;padding:12px;background:#f2e7cf;border-radius:12px}.gold{color:#8b641e}@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}.rooms{grid-template-columns:1fr}}</style></head><body><main class="app"><div class="tag">DANI DECLARES presents</div><h1>TURN <span class="gold">DAY</span></h1><p>You have one shift to turn a rough apartment into a rent-ready unit. Protect your time, budget and quality score.</p><section class="stats"><div class="card">⏱️ Time<br><b id="time">8.0h</b></div><div class="card">💵 Budget<br><b id="money">$260</b></div><div class="card">✨ Quality<br><b id="quality">0%</b></div><div class="card">🏁 Rooms<br><b id="done">0/4</b></div></section><section id="rooms" class="rooms"></section><div id="log" class="log">Choose your first move. Fast work saves time, but cutting corners can hurt quality.</div><p><button id="restart">Restart Turn</button></p></main><script>const base=[['Kitchen',100],['Bathroom',100],['Bedroom',100],['Living Area',100]];let s;const actions=[['Quick clean',1,18,24,34],['Deep reset',2,35,42,55],['Repair + clean',2.5,65,52,68]];function reset(){s={time:8,money:260,q:0,rooms:base.map(x=>({name:x[0],need:x[1],done:0})),over:false};render();msg('Choose your first move. Fast work saves time, but cutting corners can hurt quality.')}function act(i,a){if(s.over)return;let x=actions[a],r=s.rooms[i];if(s.time<x[1]||s.money<x[2])return msg('Not enough time or budget for that move.');s.time-=x[1];s.money-=x[2];r.done=Math.min(r.need,r.done+x[3]+Math.floor(Math.random()*12));s.q=s.rooms.reduce((n,z)=>n+z.done,0)/4;if(s.rooms.every(z=>z.done>=100)||s.time<=0){s.over=true;let score=Math.round(s.q);msg(score>=95?'LEASE READY! Excellent turn.':score>=75?'Almost there — respectable, but QA found misses.':'Turn failed QA. Try a better time/budget mix.')}else msg(x[0]+' completed in '+r.name+'.');render()}function msg(t){document.querySelector('#log').textContent=t}function render(){time.textContent=s.time.toFixed(1)+'h';money.textContent='$'+s.money;quality.textContent=Math.round(s.q)+'%';done.textContent=s.rooms.filter(x=>x.done>=100).length+'/4';rooms.innerHTML=s.rooms.map((r,i)=>`<div class="card room"><h3>${r.name}</h3><div class="bar"><i style="width:${r.done}%"></i></div><p>${r.done}% ready</p>${actions.map((a,j)=>`<button ${s.over||r.done>=100?'disabled':''} onclick="act(${i},${j})">${a[0]} · ${a[1]}h · $${a[2]}</button>`).join(' ')}</div>`).join('')}restart.onclick=reset;reset();</script></body></html>
