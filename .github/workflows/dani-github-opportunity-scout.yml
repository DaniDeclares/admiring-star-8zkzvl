name: DANI GitHub Opportunity Scout

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  issues: read

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Mine and qualify public GitHub opportunities
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/dani-github-opportunity-scout.mjs > github-opportunity-candidates.json
      - name: Run GitHub research radar — solutions, upgrades, opportunities
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/dani-github-research-radar.mjs > github-research-radar.json
      - name: Publish non-authoritative research radar receipt
        uses: actions/upload-artifact@v4
        with:
          name: dani-github-research-radar
          path: github-research-radar.json
          retention-days: 14
      - name: Publish non-authoritative discovery receipt
        uses: actions/upload-artifact@v4
        with:
          name: dani-github-opportunity-candidates
          path: github-opportunity-candidates.json
          retention-days: 7
