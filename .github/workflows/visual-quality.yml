name: DANI Visual Quality Gate

on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'checks/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/visual-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-quality:
    runs-on: ubuntu-latest
    env:
      PRODUCTION_BASE_URL: ${{ vars.VISUAL_QA_BASE_URL || 'https://www.danideclares.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run responsive visual quality contract
        run: npm run test:visual
      - name: Upload visual failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-quality-failure-evidence
          path: |
            test-results/**
            playwright-report/**
          if-no-files-found: ignore
          retention-days: 14
