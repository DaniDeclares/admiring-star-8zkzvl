name: Migration Ledger Preflight Tests
on:
  pull_request:
    paths:
      - 'scripts/checkProductionMigrationLedger.mjs'
      - 'scripts/checkProductionMigrationLedger.test.mjs'
      - '.github/workflows/migration-ledger-preflight.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/checkProductionMigrationLedger.mjs'
      - 'scripts/checkProductionMigrationLedger.test.mjs'
      - '.github/workflows/migration-ledger-preflight.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test read-only ledger guard
        run: node --test scripts/checkProductionMigrationLedger.test.mjs
