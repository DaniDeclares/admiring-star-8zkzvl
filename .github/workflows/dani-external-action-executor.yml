name: DANI External Action Executor

# Narrow first runtime envelope: Production promotion-feedback outbox -> Tester reconciliation RPC.
# Never executes arbitrary SQL, money movement, external contact, permission changes, merge, or deploy.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Existing external-action delivery or read-only SOP evidence review
        type: choice
        required: true
        default: external_action_delivery
        options:
          - external_action_delivery
          - sop_draft_review
      sop_job_id:
        description: Existing Production job UUID for review-only SOP draft
        type: string
        required: false
  # GitHub schedules can be delayed. Main-path activation gives the existing
  # idempotent claimant a bounded fallback whenever governed work lands.
  push:
    branches: [main]
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: dani-external-action-executor-production
  cancel-in-progress: false

jobs:
  deliver:
    if: github.event_name != 'workflow_dispatch' || inputs.mode != 'sop_draft_review'
    runs-on: ubuntu-latest
    steps:
      - name: Deliver allowlisted promotion feedback
        env:
          PROD_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          PROD_KEY: ${{ secrets.PRODUCTION_SUPABASE_SERVICE_ROLE_KEY }}
          TESTER_URL: ${{ secrets.TESTER_SUPABASE_URL }}
          TESTER_KEY: ${{ secrets.TESTER_SUPABASE_SERVICE_ROLE_KEY }}
          GH_TOKEN: ${{ github.token }}
          WORKER_KEY: github-actions:external-action:${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          node <<'NODE'
          const normalizeSupabaseUrl=value=>/^https?:\/\//i.test(value||'')
            ? value.replace(/\/+$/,'')
            : 'https://'+value+'.supabase.co';
          const req=async(url,key,path,opts={})=>{
            const r=await fetch(url+'/rest/v1/'+path,{...opts,headers:{apikey:key,Authorization:'Bearer '+key,'Content-Type':'application/json',Prefer:opts.prefer||'',...(opts.headers||{})}});
            const t=await r.text(); if(!r.ok) throw new Error(r.status+':'+t); return t?JSON.parse(t):null;
          };
          const runtimeEnv=process.env;
          if(!runtimeEnv.PROD_URL||!runtimeEnv.PROD_KEY||!runtimeEnv.TESTER_URL||!runtimeEnv.TESTER_KEY) throw new Error('Required Production/Tester Supabase secrets are missing');
          const PROD_URL=normalizeSupabaseUrl(runtimeEnv.PROD_URL), TESTER_URL=normalizeSupabaseUrl(runtimeEnv.TESTER_URL);
          const {PROD_KEY,TESTER_KEY,WORKER_KEY,GH_TOKEN}=runtimeEnv;
          // Fail closed without failing the whole scheduled worker when the Tester credential is stale.
          try { await req(TESTER_URL,TESTER_KEY,'dd_brain_signals?select=id&limit=1'); }
          catch (e) { console.error('::warning::Tester bridge unavailable; leaving Production outbox unclaimed: '+String(e.message).slice(0,300)); process.exit(0); }
          let rows=await req(PROD_URL,PROD_KEY,'rpc/dd_claim_external_actions',{method:'POST',body:JSON.stringify({p_worker_key:WORKER_KEY,p_limit:5})});
          for(const a of rows||[]){
            const prior=await req(PROD_URL,PROD_KEY,'dd_external_action_attempts?outbox_id=eq.'+a.id+'&select=attempt_no&order=attempt_no.desc&limit=1');
            const attempt=Math.max(a.attempt_count||0,prior?.[0]?.attempt_no||0)+1;
            const testerActions=new Set(['RECONCILE_TESTER_PROMOTION_FEEDBACK','INGEST_DANI_PRODUCTION_BRIDGE_LEARNING']);
            const allowTester=a.destination_system==='DANI_TESTER_SUPABASE'&&testerActions.has(a.action_type);
            const allowGitHub=a.destination_system==='GITHUB'&&a.action_type==='EXECUTE_APPROVED_GITHUB_WORK';
            const allow=allowTester||allowGitHub;
            try{
              await req(PROD_URL,PROD_KEY,'dd_external_action_attempts',{method:'POST',prefer:'return=minimal',body:JSON.stringify({outbox_id:a.id,attempt_no:attempt,worker_key:WORKER_KEY,outcome:'STARTED'})});
              if(!allow) throw Object.assign(new Error('ACTION_NOT_ALLOWLISTED'),{code:'ACTION_NOT_ALLOWLISTED'});
              let candidate=a.payload?.candidate_key, result, externalRef;
              if(allowTester){
                if(a.action_type==='RECONCILE_TESTER_PROMOTION_FEEDBACK'){
                  if(!candidate) throw Object.assign(new Error('MISSING_CANDIDATE_KEY'),{code:'INVALID_PAYLOAD'});
                  result=await req(TESTER_URL,TESTER_KEY,'rpc/dd_reconcile_tester_promotion_feedback',{method:'POST',body:JSON.stringify({p_candidate_key:candidate,p_production_state:a.payload})});
                  externalRef='tester:promotion:'+candidate;
                } else {
                  const artifact=a.payload?.artifact_key, sourceState=a.payload?.source_state;
                  if(!artifact||!sourceState) throw Object.assign(new Error('MISSING_LEARNING_PAYLOAD'),{code:'INVALID_PAYLOAD'});
                  result=await req(TESTER_URL,TESTER_KEY,'rpc/dd_ingest_production_bridge_learning',{method:'POST',body:JSON.stringify({p_payload:a.payload})});
                  externalRef='tester:learning:'+artifact;
                }
              } else {
                if(!GH_TOKEN) throw Object.assign(new Error('GITHUB_TOKEN_REQUIRED'),{code:'MISSING_RUNTIME_CREDENTIAL'});
                const approvalId=a.payload?.approval_id;
                if(!approvalId) throw Object.assign(new Error('APPROVAL_ID_REQUIRED'),{code:'INVALID_PAYLOAD'});
                const env=await req(PROD_URL,PROD_KEY,'rpc/dd_prepare_approved_github_work',{method:'POST',body:JSON.stringify({p_approval_id:approvalId})});
                const {spawnSync}=require('child_process');
                const ex=spawnSync('node',['scripts/dani-github-approved-work-executor.mjs'],{input:JSON.stringify(env),encoding:'utf8',env:{...process.env,GITHUB_TOKEN:GH_TOKEN}});
                if(ex.status!==0) throw Object.assign(new Error((ex.stderr||'GITHUB_EXECUTOR_FAILED').slice(0,1000)),{code:'GITHUB_EXECUTOR_FAILED'});
                result=JSON.parse(ex.stdout); externalRef='github:'+env.repository_full_name+'#'+env.issue_number;
              }
              await req(PROD_URL,PROD_KEY,'dd_external_action_attempts?outbox_id=eq.'+a.id+'&attempt_no=eq.'+attempt,{method:'PATCH',prefer:'return=minimal',body:JSON.stringify({completed_at:new Date().toISOString(),outcome:'SUCCEEDED',response_code:'200',external_reference:externalRef})});
              await req(PROD_URL,PROD_KEY,'dd_external_action_receipts?on_conflict=destination_system,idempotency_key',{method:'POST',prefer:'resolution=merge-duplicates,return=minimal',body:JSON.stringify({destination_system:a.destination_system,idempotency_key:a.idempotency_key,external_reference:externalRef,outcome:'SUCCEEDED',last_seen_at:new Date().toISOString(),metadata:{worker:WORKER_KEY,result}})});
              await req(PROD_URL,PROD_KEY,'dd_external_action_outbox?id=eq.'+a.id,{method:'PATCH',prefer:'return=minimal',body:JSON.stringify({status:'SUCCEEDED',attempt_count:attempt,succeeded_at:new Date().toISOString(),lease_expires_at:null,last_error:null,last_error_code:null,external_reference:externalRef})});
            }catch(e){
              const terminal=e.code==='ACTION_NOT_ALLOWLISTED'||attempt>=(a.max_attempts||5);
              await req(PROD_URL,PROD_KEY,'dd_external_action_attempts?outbox_id=eq.'+a.id+'&attempt_no=eq.'+attempt,{method:'PATCH',prefer:'return=minimal',body:JSON.stringify({completed_at:new Date().toISOString(),outcome:'FAILED',error_code:e.code||'DELIVERY_FAILED',error_detail:String(e.message).slice(0,1000)})}).catch(()=>{});
              await req(PROD_URL,PROD_KEY,'dd_external_action_outbox?id=eq.'+a.id,{method:'PATCH',prefer:'return=minimal',body:JSON.stringify({status:terminal?'DEAD_LETTER':'RETRY_WAIT',attempt_count:attempt,next_attempt_at:terminal?new Date().toISOString():new Date(Date.now()+Math.min(60,2**attempt)*60000).toISOString(),lease_expires_at:null,last_error_code:e.code||'DELIVERY_FAILED',last_error:String(e.message).slice(0,1000)})});
              if(terminal) await req(PROD_URL,PROD_KEY,'dd_external_action_dead_letters',{method:'POST',prefer:'return=minimal',body:JSON.stringify({outbox_id:a.id,destination_system:a.destination_system,action_type:a.action_type,failure_class:e.code||'DELIVERY_FAILED',final_error:String(e.message).slice(0,1000)})});
            }
          }
          NODE

  # This job never loads database secrets. It reports denied attempts explicitly.
  sop_draft_security_hold:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'sop_draft_review' && (github.event.repository.private != true || github.actor != 'DaniDeclares')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Refuse unprotected job-data processing
        run: |
          echo '::error::SOP_REVIEW_SECURITY_HOLD — private repository and authorized owner required'
          exit 1
  # Manual SOP review within the EXISTING worker; never claims external actions.
  sop_draft_review:
    # Explicitly fail closed: public-repository job metadata cannot be exported.
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'sop_draft_review' && github.event.repository.private == true && github.actor == 'DaniDeclares'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout source without persistent write credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check SOP review boundaries
        run: node --test scripts/dani-sop-review-draft.test.mjs scripts/dani-sop-worker-workflow.test.mjs

      - name: Generate draft from one existing job's event receipts
        env:
          PRODUCTION_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          SOP_REVIEW_READ_ONLY_KEY: ${{ secrets.SOP_REVIEW_READ_ONLY_KEY }}
          SOP_REVIEW_APPROVED_JOB_ID: ${{ secrets.SOP_REVIEW_APPROVED_JOB_ID }}
          SOP_JOB_ID: ${{ inputs.sop_job_id }}
        run: |
          set -euo pipefail
          if [ -z "$SOP_REVIEW_READ_ONLY_KEY" ] || [ -z "$SOP_REVIEW_APPROVED_JOB_ID" ] || [ "$SOP_JOB_ID" != "$SOP_REVIEW_APPROVED_JOB_ID" ]; then
            echo '::error::SOP_REVIEW_APPROVAL_OR_SCOPED_CREDENTIAL_MISSING'
            exit 1
          fi
          node scripts/dani-sop-review-draft.mjs \
            --job-id "$SOP_JOB_ID" \
            --out-dir "$RUNNER_TEMP/dani-sop-review"
          echo "Created review-only draft; no registry, job, customer, or Production write." >> "$GITHUB_STEP_SUMMARY"

      - name: Retain review artifacts for manual acceptance
        uses: actions/upload-artifact@v4
        with:
          name: sop-review-${{ github.run_id }}
          path: ${{ runner.temp }}/dani-sop-review/
          if-no-files-found: error
          retention-days: 1
