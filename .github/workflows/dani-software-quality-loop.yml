name: DANI Software Quality Loop

on:
  schedule:
    - cron: '23 */4 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dani-software-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Unit and integration tests
        run: npm test -- --watchAll=false
      - name: Netlify continuity preflight
        run: npm run audit:netlify-continuity
      - name: Production build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Critical release-candidate smoke
        env:
          # During the temporary Netlify continuity period, PR validation must
          # exercise the Netlify release candidate rather than parked Vercel.
          # The public domain remains the post-cutover production smoke target.
          PRODUCTION_BASE_URL: ${{ github.event_name == 'pull_request' && 'https://deploy-preview-435--sparkling-croissant-829102.netlify.app' || 'https://www.danideclares.com' }}
        run: npx playwright test checks/production-critical.spec.ts
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dani-software-quality-evidence-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
