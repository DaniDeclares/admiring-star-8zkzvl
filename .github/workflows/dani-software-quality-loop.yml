name: DANI Software Quality Loop

on:
  schedule:
    - cron: '23 */4 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dani-software-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Unit and integration tests
        run: npm test -- --watchAll=false
      - name: Production build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Resolve active QA URL
        id: qa_url
        env:
          NETLIFY_SITE: sparkling-croissant-829102
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "url=https://deploy-preview-${{ github.event.pull_request.number }}--$NETLIFY_SITE.netlify.app" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://$NETLIFY_SITE.netlify.app" >> "$GITHUB_OUTPUT"
          fi
      - name: Wait for active QA rail
        env:
          QA_URL: ${{ steps.qa_url.outputs.url }}
        run: |
          for i in {1..30}; do
            code=$(curl -L -s -o /dev/null -w "%{http_code}" "$QA_URL" || true)
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "QA rail did not become ready: $QA_URL" >&2
          exit 1
      - name: Critical public smoke
        env:
          PRODUCTION_BASE_URL: ${{ steps.qa_url.outputs.url }}
        run: npx playwright test checks/production-critical.spec.ts
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dani-software-quality-evidence-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
