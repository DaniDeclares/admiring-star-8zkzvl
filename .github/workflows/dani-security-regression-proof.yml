name: DANI Security Regression Proof

on:
  schedule:
    - cron: '41 */4 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'api/**'
      - 'netlify/functions/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  production-security-contract:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run service-role security access audit
        env:
          SB_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          SB_KEY: ${{ secrets.PRODUCTION_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SB_URL" && test -n "$SB_KEY"
          result=$(curl -fsS -X POST "$SB_URL/rest/v1/rpc/dd_run_security_access_audit"             -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY"             -H "Content-Type: application/json" -d '{}')
          echo "$result"
          status=$(printf '%s' "$result" | jq -r '.status')
          test "$status" != "FAIL"

  deterministic-security-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm test -- --watchAll=false
      - run: npm run build
