name: Supabase Migration Replay

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase-migration-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-migration-replay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@v4

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359
        with:
          version: 2.119.0

      - name: Report CLI version
        run: supabase --version

      - name: Validate migration version hygiene
        run: |
          python - <<'PY'
          from pathlib import Path
          from collections import Counter
          import re
          files = list(Path("supabase/migrations").glob("*.sql"))
          versions = [p.name.split("_", 1)[0] for p in files]
          duplicates = sorted(v for v, n in Counter(versions).items() if n > 1)
          malformed = sorted(p.name for p in files if not re.match(r"^\d{14}_", p.name) and p.name != "20260820_activation_security_hardening.sql")
          if duplicates or malformed:
              raise SystemExit(f"migration version hygiene failed: duplicates={duplicates}, malformed={malformed}")
          print(f"migration version hygiene PASS: {len(files)} files; no duplicates; only allowlisted Production-owned 20260820 legacy key may be short")
          PY

      - name: Reconcile production-owned legacy replay order
        run: |
          # Production owns migration key 20260820 (preserved by PR #413), but its
          # source commit landed at 15:33 UTC after the 14:02 field-ops and 14:26
          # portal-function prerequisites. Re-key only this disposable workspace
          # so a clean replay follows the demonstrated historical execution order.
          test -f supabase/migrations/20260820_activation_security_hardening.sql
          mv supabase/migrations/20260820_activation_security_hardening.sql \
             supabase/migrations/20260820153327_activation_security_hardening.sql

          # Production applied the 00:00:02 hardening record against a pre-existing
          # dd_task_templates relation. In canonical source, that relation's first
          # reconstructible creator is 14:02:59. Re-key only the disposable replay
          # copy immediately after that prerequisite; keep the Production-owned
          # source filename and SQL unchanged.
          test -f supabase/migrations/20260820000002_b2b_retainers_and_public_write_hardening.sql
          mv supabase/migrations/20260820000002_b2b_retainers_and_public_write_hardening.sql \
             supabase/migrations/20260820140300_b2b_retainers_and_public_write_hardening.sql

          # The 00:00:04 portal-role alignment likewise ran in Production against
          # pre-existing identity storage. Canonical source first reconstructs that
          # table at 14:26:57, so replay the unchanged record immediately afterward.
          test -f supabase/migrations/20260820000004_pass_a1_portal_role_alignment.sql
          mv supabase/migrations/20260820000004_pass_a1_portal_role_alignment.sql \
             supabase/migrations/20260820153535_pass_a1_portal_role_alignment.sql

          # The remaining early Production records below depend on canonical
          # private-schema, scheduler, portal/job, and provider foundations that
          # source reconstructs by 15:35:29. Preserve their SQL and source keys,
          # but replay disposable copies after those demonstrated prerequisites.
          test -f supabase/migrations/20260820000005_pass_a4_10_guarded_outbox_cron.sql
          mv supabase/migrations/20260820000005_pass_a4_10_guarded_outbox_cron.sql \
             supabase/migrations/20260820153530_pass_a4_10_guarded_outbox_cron.sql
          test -f supabase/migrations/20260820000008_portal_organization_scoping.sql
          mv supabase/migrations/20260820000008_portal_organization_scoping.sql \
             supabase/migrations/20260820153531_portal_organization_scoping.sql
          test -f supabase/migrations/20260820000009_provider_network_routing_engine.sql
          mv supabase/migrations/20260820000009_provider_network_routing_engine.sql \
             supabase/migrations/20260820153532_provider_network_routing_engine.sql
          test -f supabase/migrations/20260820000010_provider_routing_notifications.sql
          mv supabase/migrations/20260820000010_provider_routing_notifications.sql \
             supabase/migrations/20260820153533_provider_routing_notifications.sql
          test -f supabase/migrations/20260820000007_pass_a5_evidence_access_hardening.sql
          mv supabase/migrations/20260820000007_pass_a5_evidence_access_hardening.sql \
             supabase/migrations/20260820153534_pass_a5_evidence_access_hardening.sql

          # Production's quarantine receipt ran historically, but neither current
          # Production nor canonical clean-source tables retain the optional status
          # columns it targeted. Patch only the disposable replay copy so its stated
          # "if the table exists" intent also requires the referenced column.
          python - <<'PY'
          from pathlib import Path
          path = Path("supabase/migrations/20260823194155_quarantine_legacy_commercial_pricing.sql")
          sql = path.read_text()
          sql = sql.replace(
              "IF to_regclass('public.dd_travel_calculations') IS NOT NULL THEN",
              "IF EXISTS (SELECT 1 FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'dd_travel_calculations' AND column_name = 'status') THEN",
          )
          sql = sql.replace(
              "IF to_regclass('public.fieldops_travel_calculations') IS NOT NULL THEN",
              "IF EXISTS (SELECT 1 FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'fieldops_travel_calculations' AND column_name = 'status') THEN",
          )
          path.write_text(sql)

          path = Path("supabase/migrations/20260905000001_p0_fulfillment_state_machine_alignment.sql")
          sql = path.read_text()
          sql = sql.replace(
              "), ranked as (select c.*,row_number() over(partition by jid order by score desc,pid) rn), ins as (",
              "), ranked as (select c.*,row_number() over(partition by jid order by score desc,pid) rn from candidates c), ins as (",
          )
          path.write_text(sql)

          path = Path("supabase/migrations/20260917001856_price_32_unpriced_sell_now_services.sql")
          sql = path.read_text()
          sql = sql.replace(
              "WHERE canonical_sku IN (SELECT canonical_sku FROM tmp_new_prices);",
              "WHERE canonical_sku IN (SELECT canonical_sku FROM tmp_new_prices) AND runtime_service_id IS NOT NULL;",
          )
          path.write_text(sql)

          path = Path("supabase/migrations/20260917014659_reconcile_and_price_wedding_officiant_services.sql")
          sql = path.read_text()
          sql = sql.replace(
              "FROM unnest(ARRAY['CH01','CH02','CH03','CH04','CH05']) AS ch;",
              "FROM unnest(ARRAY['CH01','CH02','CH03','CH04','CH05']) AS ch WHERE EXISTS (SELECT 1 FROM public.services WHERE id = '0fd8d9b9-fe4f-47d2-a78b-27eed38ddd69');",
          )
          sql = sql.replace(
              "VALUES ('19c10267-898f-4c10-a25e-186f6aff8771', '0fd8d9b9-fe4f-47d2-a78b-27eed38ddd69', 'OFFICIANT_ORDAINED', 'Wedding Officiant Services', true);",
              "SELECT '19c10267-898f-4c10-a25e-186f6aff8771', '0fd8d9b9-fe4f-47d2-a78b-27eed38ddd69', 'OFFICIANT_ORDAINED', 'Wedding Officiant Services', true WHERE EXISTS (SELECT 1 FROM public.dd_provider_organizations WHERE id = '19c10267-898f-4c10-a25e-186f6aff8771') AND EXISTS (SELECT 1 FROM public.services WHERE id = '0fd8d9b9-fe4f-47d2-a78b-27eed38ddd69');",
          )
          sql = sql.replace(
              "WHERE m.canonical_sku = 'DNI-10A-022';",
              "WHERE m.canonical_sku = 'DNI-10A-022' AND EXISTS (SELECT 1 FROM public.services WHERE id = '0fd8d9b9-fe4f-47d2-a78b-27eed38ddd69');",
          )
          path.write_text(sql)

          path = Path("supabase/migrations/20260918005712_add_pet_mess_yardsale_engraving_services.sql")
          sql = path.read_text()
          sql = sql.replace(
              "JOIN public.services s ON s.sku = t.canonical_sku;\n\nDROP TABLE tmp_new_svcs;",
              "JOIN public.services s ON s.sku = t.canonical_sku WHERE EXISTS (SELECT 1 FROM public.dd_provider_organizations WHERE id = '19c10267-898f-4c10-a25e-186f6aff8771') AND EXISTS (SELECT 1 FROM public.dd_providers WHERE id = 'acba894f-a8c7-4156-b981-fa08acc9e65b');\n\nDROP TABLE tmp_new_svcs;",
          )
          path.write_text(sql)

          path = Path("supabase/migrations/20260918020500_activate_cass_division_04_bookkeeping_authorization.sql")
          sql = path.read_text()
          sql = sql.replace(
              "VALUES (gen_random_uuid(), '47eda04f-1ed4-4727-8e07-57018236009c', 'Cassandra', 'Rosser', true, now(), now(), 'Cassandra Rosser', 'Business & Financial Support Partner', 'OWNER_CONFIRMED_REAL_AGREEMENT_2026-09-18')\n  RETURNING id",
              "SELECT gen_random_uuid(), '47eda04f-1ed4-4727-8e07-57018236009c', 'Cassandra', 'Rosser', true, now(), now(), 'Cassandra Rosser', 'Business & Financial Support Partner', 'OWNER_CONFIRMED_REAL_AGREEMENT_2026-09-18' WHERE EXISTS (SELECT 1 FROM public.dd_provider_organizations WHERE id = '47eda04f-1ed4-4727-8e07-57018236009c')\n  RETURNING id",
          )
          path.write_text(sql)

          path = Path("supabase/migrations/20260918021058_authorize_christopher_walker_dtf_computer_capabilities.sql")
          sql = path.read_text()
          sql = "ALTER TABLE public.dd_provider_organizations DROP CONSTRAINT IF EXISTS dd_provider_organizations_vendor_type_check; ALTER TABLE public.dd_provider_organizations ADD CONSTRAINT dd_provider_organizations_vendor_type_check CHECK (vendor_type = ANY (ARRAY['PARTNER'::text,'SUBCONTRACTOR'::text,'EMPLOYEE'::text,'INDIVIDUAL'::text]));\n" + sql
          path.write_text(sql)

          path = Path("supabase/migrations/20260918022314_price_and_authorize_remaining_division_05_notary_candidates.sql")
          sql = path.read_text()
          sql = sql.replace(
              "JOIN public.services s ON s.sku = t.canonical_sku;\n\nDROP TABLE tmp_notary_pricing;",
              "JOIN public.services s ON s.sku = t.canonical_sku WHERE EXISTS (SELECT 1 FROM public.dd_provider_organizations WHERE id = '19c10267-898f-4c10-a25e-186f6aff8771') AND EXISTS (SELECT 1 FROM public.dd_providers WHERE id = 'acba894f-a8c7-4156-b981-fa08acc9e65b');\n\nDROP TABLE tmp_notary_pricing;",
          )
          path.write_text(sql)

          path = Path("supabase/migrations/20260918024628_fix_division_02_pricing_from_master_pricebook.sql")
          sql = path.read_text()
          sql = sql.replace(
              "JOIN public.services s ON s.sku = t.canonical_sku;\n\nDROP TABLE tmp_div02;",
              "JOIN public.services s ON s.sku = t.canonical_sku WHERE EXISTS (SELECT 1 FROM public.dd_provider_organizations WHERE id = '19c10267-898f-4c10-a25e-186f6aff8771') AND EXISTS (SELECT 1 FROM public.dd_providers WHERE id = 'acba894f-a8c7-4156-b981-fa08acc9e65b');\n\nDROP TABLE tmp_div02;",
          )
          path.write_text(sql)

          path = Path("supabase/migrations/20260918024749_add_division_04_master_pricebook_services.sql")
          sql = path.read_text()
          sql = sql.replace(
              "JOIN public.services s ON s.sku = t.canonical_sku;\n\nDROP TABLE tmp_div04;",
              "JOIN public.services s ON s.sku = t.canonical_sku WHERE EXISTS (SELECT 1 FROM public.dd_provider_organizations WHERE id = '19c10267-898f-4c10-a25e-186f6aff8771') AND EXISTS (SELECT 1 FROM public.dd_providers WHERE id = 'acba894f-a8c7-4156-b981-fa08acc9e65b');\n\nDROP TABLE tmp_div04;",
          )
          path.write_text(sql)

          for migration_name, temp_table in [
              ("20260918024917_add_division_06_master_pricebook_website_services.sql", "tmp_div06"),
              ("20260918024942_add_division_10_events_and_premium_destination_planning.sql", "tmp_div10"),
              ("20260918025002_add_division_11_merch_brand_products.sql", "tmp_div11"),
              ("20260918030615_expand_division_10_destination_event_addons.sql", "tmp_div10b"),
          ]:
              path = Path("supabase/migrations") / migration_name
              sql = path.read_text()
              sql = sql.replace(
                  f"JOIN public.services s ON s.sku = t.canonical_sku;\nDROP TABLE {temp_table};",
                  f"JOIN public.services s ON s.sku = t.canonical_sku WHERE EXISTS (SELECT 1 FROM public.dd_provider_organizations WHERE id = '19c10267-898f-4c10-a25e-186f6aff8771') AND EXISTS (SELECT 1 FROM public.dd_providers WHERE id = 'acba894f-a8c7-4156-b981-fa08acc9e65b');\nDROP TABLE {temp_table};",
              )
              path.write_text(sql)

          path = Path("supabase/migrations/20260918111540_authorize_danielle_cayla_mobile_vehicle_detailing.sql")
          sql = path.read_text()
          sql = sql.replace(
              "VALUES\n  ('19c10267-898f-4c10-a25e-186f6aff8771', 'acba894f-a8c7-4156-b981-fa08acc9e65b', '25ac02f5-8ab3-4ed1-ad52-0898d89b9980', 'Mobile Vehicle Detailing', 'VEHICLE_DETAILING', true, '{}'::jsonb),\n  ('04d66fe4-e006-4b8e-988e-e063ae93b8ab', '96b78147-c991-43d2-a3fe-4d9dc49fd90d', '25ac02f5-8ab3-4ed1-ad52-0898d89b9980', 'Mobile Vehicle Detailing', 'VEHICLE_DETAILING', true, '{}'::jsonb);",
              "SELECT '19c10267-898f-4c10-a25e-186f6aff8771'::uuid, 'acba894f-a8c7-4156-b981-fa08acc9e65b'::uuid, '25ac02f5-8ab3-4ed1-ad52-0898d89b9980'::uuid, 'Mobile Vehicle Detailing', 'VEHICLE_DETAILING', true, '{}'::jsonb WHERE EXISTS (SELECT 1 FROM public.dd_provider_organizations WHERE id = '19c10267-898f-4c10-a25e-186f6aff8771') AND EXISTS (SELECT 1 FROM public.dd_providers WHERE id = 'acba894f-a8c7-4156-b981-fa08acc9e65b') AND EXISTS (SELECT 1 FROM public.services WHERE id = '25ac02f5-8ab3-4ed1-ad52-0898d89b9980') UNION ALL SELECT '04d66fe4-e006-4b8e-988e-e063ae93b8ab'::uuid, '96b78147-c991-43d2-a3fe-4d9dc49fd90d'::uuid, '25ac02f5-8ab3-4ed1-ad52-0898d89b9980'::uuid, 'Mobile Vehicle Detailing', 'VEHICLE_DETAILING', true, '{}'::jsonb WHERE EXISTS (SELECT 1 FROM public.dd_provider_organizations WHERE id = '04d66fe4-e006-4b8e-988e-e063ae93b8ab') AND EXISTS (SELECT 1 FROM public.dd_providers WHERE id = '96b78147-c991-43d2-a3fe-4d9dc49fd90d') AND EXISTS (SELECT 1 FROM public.services WHERE id = '25ac02f5-8ab3-4ed1-ad52-0898d89b9980');",
          )
          path.write_text(sql)

          path = Path("supabase/migrations/20260918134516_remove_legacy_provider_document_rpc_overload.sql")
          sql = path.read_text()
          sql = sql.replace(
              "revoke execute on function public.dd_record_provider_application_document(uuid, text, text, text, text, date, uuid) from public;\ngrant execute on function public.dd_record_provider_application_document(uuid, text, text, text, text, date, uuid) to authenticated, service_role, postgres;",
              "DO $guard$ BEGIN IF to_regprocedure('public.dd_record_provider_application_document(uuid,text,text,text,text,date,uuid)') IS NOT NULL THEN EXECUTE 'revoke execute on function public.dd_record_provider_application_document(uuid, text, text, text, text, date, uuid) from public'; EXECUTE 'grant execute on function public.dd_record_provider_application_document(uuid, text, text, text, text, date, uuid) to authenticated, service_role, postgres'; END IF; END $guard$;",
          )
          path.write_text(sql)

          path = Path("supabase/migrations/20260919000124_create_pricing_engines_registry_and_backfill.sql")
          sql = path.read_text()
          sql = sql.replace(
              "    if v_total != 279 then\n        raise exception 'Eligible population drifted: expected 279, found %. Re-run classification before backfilling.', v_total;",
              "    if v_total = 0 then\n        raise notice 'Clean replay has no seeded SELL_NOW service population; schema and registry retained, Production-data backfill assertions skipped.';\n        return;\n    elsif v_total != 279 then\n        raise exception 'Eligible population drifted: expected 279, found %. Re-run classification before backfilling.', v_total;",
          )
          path.write_text(sql)
          PY

      - name: Initialize isolated local Supabase config
        run: test -f supabase/config.toml || supabase init

      - name: Start isolated local Supabase and apply migrations
        run: supabase start

      - name: Replay migrations from scratch without seed data
        run: supabase db reset --no-seed

      - name: Stop isolated local Supabase
        if: always()
        run: supabase stop --no-backup || true
