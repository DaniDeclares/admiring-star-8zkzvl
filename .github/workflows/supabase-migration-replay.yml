name: Supabase Migration Replay

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase-migration-replay.yml'
      - 'scripts/replay_shim_provider_guard_format.py'
      - 'scripts/test_replay_shim_provider_guard_format.py'
      - 'scripts/replay_seed_services_prerequisite.py'
      - 'scripts/test_replay_seed_services_prerequisite.py'
      - 'scripts/replay_skip_production_proofs.py'
      - 'scripts/test_replay_skip_production_proofs.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-migration-replay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@v4

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359
        with:
          version: 2.119.0

      - name: Report CLI version
        run: supabase --version

      - name: Validate migration version hygiene
        run: |
          python - <<'PY'
          from pathlib import Path
          from collections import Counter
          import re
          files = list(Path("supabase/migrations").glob("*.sql"))
          versions = [p.name.split("_", 1)[0] for p in files]
          duplicates = sorted(v for v, n in Counter(versions).items() if n > 1)
          malformed = sorted(p.name for p in files if not re.match(r"^\d{14}_", p.name) and p.name != "20260820_activation_security_hardening.sql")
          if duplicates or malformed:
              raise SystemExit(f"migration version hygiene failed: duplicates={duplicates}, malformed={malformed}")
          print(f"migration version hygiene PASS: {len(files)} files; no duplicates; only allowlisted Production-owned 20260820 legacy key may be short")
          PY
