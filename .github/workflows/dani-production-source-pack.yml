name: DANI Production Source Pack
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package deploy source
        run: zip -qr /tmp/dani-production-source.zip . -x ".git/*" "node_modules/*"
      - uses: actions/upload-artifact@v4
        with:
          name: dani-production-source
          path: /tmp/dani-production-source.zip
          retention-days: 1
